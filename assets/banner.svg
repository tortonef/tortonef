<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-label="Federico Tortonesi: Service Delivery Manager, AI Transformation, GenAI Builder">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0c14"/>
      <stop offset="1" stop-color="#121624"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.78" cy="0.35" r="0.5">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.12" cy="0.95" r="0.55">
      <stop offset="0" stop-color="#3b82f6" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="txt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="node" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.035"/>
    </pattern>
    <clipPath id="card"><rect width="1200" height="380" rx="22"/></clipPath>
    <style>
      .t { font-family: 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif; }
      .m { font-family: 'JetBrains Mono', Consolas, 'SF Mono', Menlo, monospace; }
      .edge { stroke: #a78bfa; stroke-opacity: .35; stroke-width: 1.6; fill: none; stroke-dasharray: 5 7; animation: flow 1.6s linear infinite; }
      .pulse { animation: pulse 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .blink { animation: blink 1.1s steps(1) infinite; }
      @keyframes flow { to { stroke-dashoffset: -24; } }
      @keyframes pulse { 0%,100% { opacity: .35; transform: scale(1); } 50% { opacity: .9; transform: scale(1.25); } }
      @keyframes blink { 50% { opacity: 0; } }
      @media (prefers-reduced-motion: reduce) { .edge, .pulse, .blink { animation: none; } }
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="380" fill="url(#bg)"/>
    <rect width="1200" height="380" fill="url(#grid)"/>
    <rect width="1200" height="380" fill="url(#glowA)"/>
    <rect width="1200" height="380" fill="url(#glowB)"/>

    <!-- Left: identity -->
    <g transform="translate(64 0)">
      <rect y="70" width="296" height="30" rx="15" fill="#8b5cf6" fill-opacity=".12" stroke="#8b5cf6" stroke-opacity=".35"/>
      <circle cx="18" cy="85" r="4" fill="#34d399" class="pulse"/>
      <text x="32" y="90" class="m" font-size="12.5" letter-spacing="1.6" fill="#c4b5fd">GENAI · AGENTS · AUTOMATION</text>

      <text x="0" y="160" class="t" font-size="54" font-weight="700" fill="#f1f5f9" letter-spacing="-1">Federico Tortonesi</text>
      <text x="0" y="200" class="t" font-size="21" font-weight="600" fill="url(#txt)">Service Delivery Manager · AI Transformation · GenAI Builder</text>

      <text x="0" y="252" class="t" font-size="17" fill="#94a3b8">I translate business challenges into AI transformation opportunities,</text>
      <text x="0" y="278" class="t" font-size="17" fill="#94a3b8">and I build the systems that prove them.</text>

      <text x="0" y="330" class="m" font-size="13" fill="#64748b">$ <tspan fill="#a78bfa">run</tspan> --from <tspan fill="#60a5fa">business_problem</tspan> --to <tspan fill="#34d399">production_value</tspan><tspan class="blink" fill="#e2e8f0"> ▌</tspan></text>
    </g>

    <!-- Right: agent graph -->
    <g transform="translate(770 0)">
      <path id="e1" class="edge" d="M60 190 C 120 190, 120 100, 180 100"/>
      <path id="e2" class="edge" d="M60 190 C 120 190, 120 280, 180 280"/>
      <path id="e3" class="edge" d="M240 100 C 290 100, 290 190, 330 190"/>
      <path id="e4" class="edge" d="M240 280 C 290 280, 290 190, 330 190"/>
      <path id="e5" class="edge" d="M60 190 L 330 190" style="stroke-opacity:.18"/>

      <circle r="4" fill="#a78bfa"><animateMotion dur="2.6s" repeatCount="indefinite"><mpath href="#e1"/></animateMotion></circle>
      <circle r="4" fill="#60a5fa"><animateMotion dur="2.6s" begin="1.3s" repeatCount="indefinite"><mpath href="#e2"/></animateMotion></circle>
      <circle r="4" fill="#34d399"><animateMotion dur="2.6s" begin=".6s" repeatCount="indefinite"><mpath href="#e3"/></animateMotion></circle>
      <circle r="4" fill="#34d399"><animateMotion dur="2.6s" begin="1.9s" repeatCount="indefinite"><mpath href="#e4"/></animateMotion></circle>

      <!-- nodes -->
      <g class="t" font-size="12" font-weight="600" text-anchor="middle">
        <circle cx="30" cy="190" r="40" fill="url(#node)" fill-opacity=".14" class="pulse"/>
        <rect x="-2" y="168" width="64" height="44" rx="12" fill="#1a1f31" stroke="url(#node)" stroke-width="1.6"/>
        <text x="30" y="195" fill="#e2e8f0">Planner</text>

        <rect x="172" y="78" width="76" height="44" rx="12" fill="#1a1f31" stroke="#a78bfa" stroke-opacity=".6"/>
        <text x="210" y="105" fill="#e2e8f0">Retriever</text>

        <rect x="172" y="258" width="76" height="44" rx="12" fill="#1a1f31" stroke="#60a5fa" stroke-opacity=".6"/>
        <text x="210" y="285" fill="#e2e8f0">Tools</text>

        <rect x="322" y="168" width="76" height="44" rx="12" fill="#1a1f31" stroke="#34d399" stroke-opacity=".7"/>
        <text x="360" y="195" fill="#e2e8f0">Answer</text>
      </g>
      <g class="m" font-size="10.5" fill="#64748b" text-anchor="middle">
        <text x="210" y="66">RAG · citations</text>
        <text x="210" y="322">MCP · actions</text>
        <text x="360" y="232">human-in-the-loop</text>
      </g>
    </g>

    <rect x=".5" y=".5" width="1199" height="379" rx="22" fill="none" stroke="#ffffff" stroke-opacity=".08"/>
  </g>
</svg>
