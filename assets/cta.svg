<svg xmlns="http://www.w3.org/2000/svg" width="440" height="64" viewBox="0 0 440 64" role="img" aria-label="Open the Interactive GenAI Lab">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#fff" stop-opacity=".28"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="c"><rect x="2" y="2" width="436" height="60" rx="30"/></clipPath>
    <style>
      .s { animation: sweep 3.2s ease-in-out infinite; }
      @keyframes sweep { 0% { transform: translateX(-160px); } 60%,100% { transform: translateX(460px); } }
      @media (prefers-reduced-motion: reduce) { .s { animation: none; opacity: 0; } }
    </style>
  </defs>
  <g clip-path="url(#c)">
    <rect x="2" y="2" width="436" height="60" rx="30" fill="url(#g)"/>
    <rect class="s" x="0" y="0" width="120" height="64" fill="url(#shine)"/>
  </g>
  <circle cx="36" cy="32" r="14" fill="#fff" fill-opacity=".18"/>
  <path d="M31 24.5 L42 32 L31 39.5 Z" fill="#fff"/>
  <text x="62" y="38.5" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="700" fill="#fff">Open the Interactive GenAI Lab</text>
  <path d="M400 26 L408 32 L400 38" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
