<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="150" viewBox="0 0 1200 150" role="img" aria-label="5+ years in enterprise data and AI delivery; about 50 professionals trained in AI; 9 certifications; 10 open-source AI builds">
  <defs>
    <linearGradient id="n" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
    <style>
      .t { font-family: 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif; }
      .m { font-family: 'JetBrains Mono', Consolas, 'SF Mono', Menlo, monospace; }
      .card { fill: #0e111b; stroke: #ffffff; stroke-opacity: .08; }
      .up { animation: up .9s ease-out both; }
      @keyframes up { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
      @media (prefers-reduced-motion: reduce) { .up { animation: none; } }
    </style>
  </defs>
  <g class="t" text-anchor="start">
    <g transform="translate(0 0)"><g class="up" style="animation-delay:0s">
      <rect class="card" x=".5" y=".5" width="285" height="149" rx="18"/>
      <rect x="24" y="24" width="28" height="4" rx="2" fill="#8b5cf6"/>
      <text x="24" y="86" font-size="44" font-weight="700" fill="url(#n)">5+ yrs</text>
      <text x="24" y="118" font-size="15" fill="#94a3b8">enterprise data &amp; AI delivery</text>
    </g></g>
    <g transform="translate(305 0)"><g class="up" style="animation-delay:.12s">
      <rect class="card" x=".5" y=".5" width="285" height="149" rx="18"/>
      <rect x="24" y="24" width="28" height="4" rx="2" fill="#3b82f6"/>
      <text x="24" y="86" font-size="44" font-weight="700" fill="url(#n)">~50</text>
      <text x="24" y="118" font-size="15" fill="#94a3b8">professionals trained in AI</text>
    </g></g>
    <g transform="translate(610 0)"><g class="up" style="animation-delay:.24s">
      <rect class="card" x=".5" y=".5" width="285" height="149" rx="18"/>
      <rect x="24" y="24" width="28" height="4" rx="2" fill="#34d399"/>
      <text x="24" y="86" font-size="44" font-weight="700" fill="url(#n)">9</text>
      <text x="24" y="118" font-size="15" fill="#94a3b8">certifications: Claude, GCP, Azure</text>
    </g></g>
    <g transform="translate(915 0)"><g class="up" style="animation-delay:.36s">
      <rect class="card" x=".5" y=".5" width="284" height="149" rx="18"/>
      <rect x="24" y="24" width="28" height="4" rx="2" fill="#fbbf24"/>
      <text x="24" y="86" font-size="44" font-weight="700" fill="url(#n)">10</text>
      <text x="24" y="118" font-size="15" fill="#94a3b8">open-source AI builds</text>
    </g></g>
  </g>
</svg>
