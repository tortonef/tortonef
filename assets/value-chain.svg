<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="200" viewBox="0 0 1200 200" role="img" aria-label="How I create value: business challenge, AI use case and roadmap, working prototype, production value">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0a0c14"/>
      <stop offset="1" stop-color="#121624"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset=".6" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <style>
      .t { font-family: 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif; }
      .m { font-family: 'JetBrains Mono', Consolas, 'SF Mono', Menlo, monospace; }
      .flow { stroke-dasharray: 6 10; animation: f 1.4s linear infinite; }
      @keyframes f { to { stroke-dashoffset: -32; } }
      @media (prefers-reduced-motion: reduce) { .flow { animation: none; } }
    </style>
  </defs>
  <rect width="1200" height="200" rx="22" fill="url(#bg)"/>
  <rect x=".5" y=".5" width="1199" height="199" rx="22" fill="none" stroke="#fff" stroke-opacity=".08"/>

  <path d="M150 92 H1050" stroke="url(#line)" stroke-opacity=".25" stroke-width="2"/>
  <path class="flow" d="M150 92 H1050" stroke="url(#line)" stroke-width="2.5" fill="none"/>

  <g class="t" text-anchor="middle">
    <g transform="translate(150 0)">
      <circle cy="92" r="26" fill="#121624" stroke="#8b5cf6" stroke-width="2"/>
      <text y="99" class="m" font-size="17" font-weight="700" fill="#c4b5fd">01</text>
      <text y="44" class="m" font-size="11" letter-spacing="1.5" fill="#8b5cf6">DISCOVER</text>
      <text y="146" font-size="16" font-weight="600" fill="#f1f5f9">Business challenge</text>
      <text y="168" font-size="13" fill="#64748b">processes, pain points, KPIs</text>
    </g>
    <g transform="translate(450 0)">
      <circle cy="92" r="26" fill="#121624" stroke="#7c6cf6" stroke-width="2"/>
      <text y="99" class="m" font-size="17" font-weight="700" fill="#c4b5fd">02</text>
      <text y="44" class="m" font-size="11" letter-spacing="1.5" fill="#7c6cf6">SHAPE</text>
      <text y="146" font-size="16" font-weight="600" fill="#f1f5f9">AI use case &amp; roadmap</text>
      <text y="168" font-size="13" fill="#64748b">value, feasibility, risk</text>
    </g>
    <g transform="translate(750 0)">
      <circle cy="92" r="26" fill="#121624" stroke="#3b82f6" stroke-width="2"/>
      <text y="99" class="m" font-size="17" font-weight="700" fill="#93c5fd">03</text>
      <text y="44" class="m" font-size="11" letter-spacing="1.5" fill="#3b82f6">BUILD</text>
      <text y="146" font-size="16" font-weight="600" fill="#f1f5f9">Working prototype</text>
      <text y="168" font-size="13" fill="#64748b">RAG, agents, automation</text>
    </g>
    <g transform="translate(1050 0)">
      <circle cy="92" r="26" fill="#121624" stroke="#34d399" stroke-width="2"/>
      <text y="99" class="m" font-size="17" font-weight="700" fill="#6ee7b7">04</text>
      <text y="44" class="m" font-size="11" letter-spacing="1.5" fill="#34d399">DELIVER</text>
      <text y="146" font-size="16" font-weight="600" fill="#f1f5f9">Production value</text>
      <text y="168" font-size="13" fill="#64748b">governance, SLAs, adoption</text>
    </g>
  </g>
</svg>
